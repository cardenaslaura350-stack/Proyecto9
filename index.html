<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip navegador</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <footer> <!-- Contenedor principal exterior (marrón claro) -->
        <div class="exterior">
            <!-- Contenedor interior blanco -->
            <div class="interior">
                <nav class="navegacion">
                    <ul class="links">
                        <!-- Home con efecto Fade-in -->
                        <li class="item">
                            <a href="#" class="boton">Home</a>
                            <span class="info desvanecer">Ir a la página principal</span>
                        </li>
                        <!-- Proyectos con efecto Slide-in -->
                        <li class="item">
                            <a href="#" class="boton">Proyectos</a>
                            <span class="info desvanecer">Ver todos mis trabajos</span>
                        </li>
                        <!-- Contacto con efecto Scale-in -->
                        <li class="item">
                            <a href="#" class="boton">Contacto</a>
                            <span class="info desvanecer">Ponte en contacto conmigo</span>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </footer>

</body>

</html>
